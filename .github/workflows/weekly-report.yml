# 매주 월요일 오전 7시 40분쯤(한국 시간) 홈페이지 주간 보고 메일 발송
name: 홈페이지 주간 보고

on:
  schedule:
    - cron: '41 22 * * 0'   # 일요일 22:41 UTC = 월요일 07:41 KST
  workflow_dispatch:         # 깃허브에서 '지금 실행'으로 시험 가능

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q google-analytics-data google-api-python-client google-auth
      - run: python .github/scripts/weekly_report.py
        env:
          GA_SA_KEY: ${{ secrets.GA_SA_KEY }}
